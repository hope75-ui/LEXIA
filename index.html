document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

r-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; x-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: n-items:flex-start;padding:14px;border-radius:22px;background:var(--color-accent-2-100);color:var(--color-accent-2-800);\">\n      <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:1px;\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg>\n      <div style=\"font-size:12px;line-height:1.4;\"><b>Zero-cloud.<\u002Fb> Audio e dati restano nella RAM di questo dispositivo.<\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Faside>\n\n  <div style=\"flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;order:{{ contentOrder }};\">\n    <div style=\"min-height:60px;flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px clamp(14px,4vw,32px);\">\n      <div style=\"font-family:var(--font-heading);font-size:clamp(18px,3.2vw,24px);margin-right:auto;\">{{ screenTitle }}<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ goClasses }}\" class=\"tag tag-neutral\" style=\"font-size:12px;padding:5px 12px;border:0;cursor:pointer;font-family:var(--font-body);\" style-hover=\"background:var(--color-accent-100)\">Alunno {{ activeCode }} · Classe {{ activeClassName }}<\u002Fbutton>\n      <span class=\"tag tag-accent-2\" style=\"font-size:12px;padding:5px 12px;\">{{ modeLabel }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1;min-height:0;overflow:auto;padding:4px clamp(14px,4vw,32px) clamp(14px,4vw,32px);\">\n\n<sc-if value=\"{{ isDash }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;flex-direction:column;gap:30px;\">\n  <div style=\"display:flex;flex-direction:column;gap:12px;max-width:760px;padding-top:10px;\">\n    <div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);\">Project Work · Master in Etica e Intelligenza Artificiale (MEIA) · Dipartimento di Filosofia e Scienze dell'Educazione · Università degli Studi di Torino<\u002Fdiv>\n    <h1 style=\"font-size:clamp(34px,6.5vw,64px);margin:0;\">LEXIA<br>Algoritmi di equità<\u002Fh1>\n    <p style=\"font-size:clamp(16px,2.2vw,20px);line-height:1.4;margin:0;text-wrap:pretty;\">Valutazione d'impatto, formazione dei docenti e un mockup ad accessibilità universale per l'educazione alla lettura nella scuola primaria.<\u002Fp>\n    <div style=\"display:flex;gap:24px;font-size:13px;color:var(--color-neutral-700);\"><span>Candidati: <b style=\"color:var(--color-text);\">Sonia Cercelletta · Marco Galletti · Giovanni Malpignano · Sara Micali<\u002Fb><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;\">\n    <div class=\"card\" style=\"padding:22px;gap:10px;\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;\"><div style=\"width:44px;height:44px;border-radius:50%;background:var(--color-bg);display:grid;place-items:center;font-family:var(--font-heading);font-size:18px;\">1<\u002Fdiv><span class=\"tag tag-neutral\">Area 1<\u002Fspan><\u002Fdiv>\n      <div class=\"card-title\" style=\"font-size:19px;\">Analisi dei rischi e audit<\u002Fdiv>\n      <p class=\"card-body\">Obblighi della scuola come deployer (artt. 4 e 26 AI Act) e audit documentale dei regolamenti IA di prima generazione su un Istituto Comprensivo piemontese.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"padding:22px;gap:10px;\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;\"><div style=\"width:44px;height:44px;border-radius:50%;background:var(--color-bg);display:grid;place-items:center;font-family:var(--font-heading);font-size:18px;\">2<\u002Fdiv><span class=\"tag tag-neutral\">Area 4<\u002Fspan><\u002Fdiv>\n      <div class=\"card-title\" style=\"font-size:19px;\">Governance e formazione<\u002Fdiv>\n      <p class=\"card-body\">Regolamento d'Istituto a doppio regime (Allegato A) e percorso docenti Human-in-the-loop, 10 ore in 3 moduli (Allegato B).<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"padding:22px;gap:10px;background:var(--color-accent-2-200);\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;\"><div style=\"width:44px;height:44px;border-radius:50%;background:var(--color-accent-2-600);color:var(--color-bg);display:grid;place-items:center;font-family:var(--font-heading);font-size:18px;\">3<\u002Fdiv><span class=\"tag tag-accent-2\" style=\"background:var(--color-bg);\">Area 2<\u002Fspan><\u002Fdiv>\n      <div class=\"card-title\" style=\"font-size:19px;\">Prototipo LEXIA Pro<\u002Fdiv>\n      <p class=\"card-body\">Web app locale, deterministica e interamente offline, con modulo CAA, puntamento oculare e scansione switch (Allegato C).<\u002Fp>\n      <div><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ goRead }}\" style=\"margin-top:4px;\">Apri il prototipo →<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"card\" style=\"padding:26px 28px;gap:16px;background:var(--color-neutral-100);\">\n    <div style=\"display:flex;align-items:center;gap:16px;flex-wrap:wrap;\">\n      <div style=\"margin-right:auto;\"><div class=\"card-kicker\" style=\"color:var(--color-accent-700);\">Comparatore<\u002Fdiv><div class=\"card-title\" style=\"font-size:22px;\">Tre strade di mitigazione tecnologica<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--color-surface);\">\n        <sc-for list=\"{{ pathBtns }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ p.onClick }}\" style=\"border:0;border-radius:999px;padding:8px 16px;font:600 13px var(--font-body);cursor:pointer;background:{{ p.bg }};color:{{ p.fg }};\">{{ p.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-raw-table class=\"table\" style=\"font-size:14px;\">\n      <sc-raw-tbody>\n        <sc-for list=\"{{ cmpRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n          <sc-raw-tr><sc-raw-td style=\"width:36%;color:var(--color-neutral-700);padding:11px 8px;\">{{ r.label }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:11px 8px;font-weight:600;\">{{ r.val }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px;max-width:960px;\">\n    <div style=\"display:flex;flex-direction:column;gap:6px;\">\n      <div style=\"font-family:var(--font-heading);font-size:26px;line-height:1.15;color:var(--color-accent-700);\">Obiettivo della ricerca<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--color-neutral-700);\">Domanda di ricerca principale (Q0)<\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:17px;line-height:1.55;margin:0;text-wrap:pretty;\">Il progetto individua un modello di governance e di mitigazione tecnologica con cui una scuola del primo ciclo può usare sistemi di IA per l'educazione alla lettura nel rispetto dell'AI Act e del GDPR. L'obiettivo è garantire a tutti gli alunni lo stesso accesso e la stessa dignità didattica, compresi quelli le cui famiglie non hanno dato il consenso e quelli con gravi limitazioni neuromotorie.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isRead }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:16px;\">\n  <div style=\"display:flex;align-items:center;gap:12px;\">\n    <div style=\"display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--color-surface);margin-right:auto;\">\n      <sc-for list=\"{{ modeBtns }}\" as=\"m\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ m.onClick }}\" style=\"border:0;border-radius:999px;padding:8px 16px;font:600 13px var(--font-body);cursor:pointer;background:{{ m.bg } \"card-body\" style=\"margin:0;\">Incolla i nomi, uno per riga. Ogni alunno riceve un codice casuale: LEXIA Pro salva solo i codici.<\u002Fp>\n        <textarea class=\"input\" value=\"{{ namesText }}\" sc-camel-on-change=\"{{ setNames }}\" placeholder=\"Un nome per riga\" style=\"min-height:96px;border-radius:22px;\"><\u002Ftextarea>\n        <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ genCodes }}\" disabled=\"{{ genDisabled }}\">Genera codici · {{ nNames }} alunni<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"padding:20px;gap:10px;background:var(--color-neutral-100);\">\n        <div class=\"card-title\">Aggiungi senza nomi<\u002Fdiv>\n        <p class=\"card-body\" style=\"margin:0;\">Crea subito codici anonimi e annota la corrispondenza sul registro cartaceo.<\u002Fp>\n        <div style=\"display:flex;gap:8px;align-items:center;\">\n          <input class=\"input\" type=\"number\" min=\"1\" max=\"30\" value=\"{{ nAnon }}\" sc-camel-on-change=\"{{ setNAnon }}\" style=\"width:90px;\">\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ addAnon }}\">Aggiungi codici<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ hasKey }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:20px 22px;border-radius:28px;background:var(--color-accent-100);display:flex;flex-direction:column;gap:12px;\">\n        <div style=\"display:flex;align-items:center;gap:10px;\"><b style=\"font-size:16px;margin-right:auto;color:var(--color-accent-900);\">Chiave di corrispondenza · visibile solo ora<\u002Fb>\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ downloadKey }}\" style=\"background:var(--color-bg);\">Scarica chiave (.csv)<\u002Fbutton>\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ clearKey }}\">Fatto, cancella i nomi<\u002Fbutton><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 18px;font-size:14px;\">\n          <sc-for list=\"{{ keyRows }}\" as=\"k\" hint-placeholder-count=\"3\"><div style=\"display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--color-divider);\"><span>{{ k.name }}<\u002Fspan><b>{{ k.code }}<\u002Fb><\u002Fdiv><\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--color-accent-800);\">I nomi restano solo in memoria finché non premi \"Fatto\" e non vengono mai salvati. Conserva la chiave fuori da LEXIA Pro, ad esempio nel registro.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isLib }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;align-items:start;\">\n  <div style=\"display:flex;flex-direction:column;gap:14px;\">\n    <p style=\"margin:0;font-size:14px;color:var(--color-neutral-800);max-width:600px;text-wrap:pretty;\">Testi liberi da diritti per la lettura e la marcatura. L'archivio è salvato solo su questo dispositivo.<\u002Fp>\n    <div style=\"display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--color-surface);align-self:flex-start;\">\n      <sc-for list=\"{{ libFilters }}\" as=\"lf\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ lf.onClick }}\" style=\"white-space:nowrap;flex:none;border:0;border-radius:999px;padding:8px 16px;font:600 13px var(--font-body);cursor:pointer;background:{{ lf.bg }};color:{{ lf.fg }};\">{{ lf.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-for list=\"{{ libItems }}\" as=\"it\" hint-placeholder-count=\"4\">\n      <div class=\"card\" style=\"padding:20px 22px;gap:8px;background:var(--color-neutral-100);\">\n        <div style=\"display:flex;align-items:flex-start;gap:12px;\">\n          <sc-if value=\"{{ it.isBook }}\" hint-placeholder-val=\"{{ false }}\"><div role=\"img\" aria-label=\"Copertina\" style=\"width:96px;height:72px;flex:none;border-radius:16px;background:var(--color-surface) center/cover no-repeat {{ it.coverCss }};\"><\u002Fdiv><\u002Fsc-if>\n          <div style=\"flex:1;min-width:0;\"><div class=\"card-title\" style=\"font-size:19px;\">{{ it.title }}<\u002Fdiv><div style=\"font-size:13px;color:var(--color-neutral-700);margin-top:2px;\">{{ it.meta }}<\u002Fdiv><\u002Fdiv>\n          <span class=\"{{ it.tagClass }}\" style=\"white-space:nowrap;flex:none;\">{{ it.license }}<\u002Fspan>\n          <span class=\"tag tag-neutral\" style=\"background:var(--color-surface);white-space:nowrap;flex:none;\">{{ it.level }}<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:14px;line-height:1.5;color:var(--color-neutral-800);text-wrap:pretty;\">{{ it.preview }}<\u002Fp>\n        <div style=\"display:flex;align-items:center;gap:10px;\">\n          <span style=\"font-size:12px;color:var(--color-neutral-700);margin-right:auto;min-width:0;\">Fonte: {{ it.source }}<\u002Fspan>\n          <sc-if value=\"{{ it.isMine }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ it.onRemove }}\" style=\"white-space:nowrap;flex:none;\">Rimuovi<\u002Fbutton><\u002Fsc-if>\n          <sc-if value=\"{{ it.isBook }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ openBook }}\" style=\"white-space:nowrap;flex:none;\">Sfoglia in CAA<\u002Fbutton><\u002Fsc-if>\n          <button class=\"{{ it.useClass }}\" sc-camel-on-click=\"{{ it.onUse }}\" style=\"white-space:nowrap;flex:none;\">{{ it.useLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:14px;\">\n    <div class=\"card\" style=\"padding:22px;gap:12px;\">\n      <div class=\"card-title\" style=\"font-size:20px;\">Aggiungi un testo<\u002Fdiv>\n      <div class=\"field\"><label>Titolo<\u002Flabel><input class=\"input\" value=\"{{ form.title }}\" sc-camel-on-change=\"{{ setTitle }}\" placeholder=\"es. Pinocchio, capitolo II\"><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;\">\n        <div class=\"field\"><label>Autore<\u002Flabel><input class=\"input\" value=\"{{ form.author }}\" sc-camel-on-change=\"{{ setAuthor }}\" placeholder=\"es. Carlo Collodi\"><\u002Fdiv>\n        <div class=\"field\"><label>Livello<\u002Flabel><sc-raw-select class=\"input\" value=\"{{ form.level }}\" sc-camel-on-change=\"{{ setLevel }}\"><option value=\"1\">1 · primi lettori<\u002Foption><option value=\"2\">2 · intermedio<\u002Foption><option value=\"3\">3 · autonomo<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"field\"><label>Licenza<\u002Flabel><sc-raw-select class=\"input\" value=\"{{ form.license }}\" sc-camel-on-change=\"{{ setLicense }}\"><option value=\"Pubblico dominio\">Pubblico dominio<\u002Foption><option value=\"CC BY\">Creative Commons CC BY<\u002Foption><option value=\"CC BY-SA\">Creative Commons CC BY-SA<\u002Foption><option value=\"Testo originale del docente\">Testo originale del docente<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n      <div class=\"field\"><label>Fonte (link o edizione)<\u002Flabel><input class=\"input\" value=\"{{ form.source }}\" sc-camel-on-change=\"{{ setSource }}\" placeholder=\"es. liberliber.it\"><\u002Fdiv>\n      <div class=\"field\"><label>Testo<\u002Flabel><textarea class=\"input\" value=\"{{ form.text }}\" sc-camel-on-change=\"{{ setText }}\" placeholder=\"Incolla qui il brano\" style=\"min-height:110px;border-radius:22px;\"><\u002Ftextarea><\u002Fdiv>\n      <label style=\"display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4;cursor:pointer;\"><input type=\"checkbox\" checked=\"{{ form.ok }}\" sc-camel-on-change=\"{{ setOk }}\" style=\"accent-color:var(--color-accent);width:18px;height:18px;margin:1px 0 0;flex:none;\">Ho verificato che il testo è libero da diritti o che la licenza ne consente l'uso in classe.<\u002Flabel>\n      <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ saveText }}\" disabled=\"{{ saveDisabled }}\" style=\"padding:11px 20px;\">Salva nell'archivio<\u002Fbutton>\n      <sc-if value=\"{{ hasLibMsg }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13px;color:var(--color-accent-2-800);font-weight:600;\">{{ libMsg }}<\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"padding:18px 20px;border-radius:28px;background:var(--color-accent-2-100);color:var(--color-accent-2-900);display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.45;\">\n      <b style=\"font-size:14px;\">Prima di inserire un testo<\u002Fb>\n      <div><b>Pubblico dominio:<\u002Fb> l'autore è morto da oltre 70 anni. Traduzioni, adattamenti e illustrazioni recenti hanno diritti propri.<\u002Fdiv>\n      <div><b>Creative Commons:<\u002Fb> indica sempre autore, fonte e licenza.<\u002Fdiv>\n      <div><b>Dove cercare:<\u002Fb> Liber Liber, Wikisource, Project Gutenberg.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isSettings }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:20px;max-width:900px;\">\n  <div>\n    <div style=\"font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-700);margin-bottom:10px;\">Modalità di input<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;\">\n      <sc-for list=\"{{ modeCards }}\" as=\"m\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ m.onClick }}\" style=\"text-align:left;padding:20px;border-radius:28px;border:3px solid {{ m.border }};background:{{ m.bg }};cursor:pointer;font-family:var(--font-body);color:var(--color-text);display:flex;flex-direction:column;gap:4px;\">\n          <span style=\"font-family:var(--font-heading);font-size ompact ? '76px' : '24px';\n    const botPanelStyle = 'position:absolute;right:24px;bottom:' + botBottom + ';width:384px;height:580px;border-radius:34px;'\n      + 'background:var(--color-neutral-100);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;';\n    const fmt = (n, d = 1) => n.toFixed(d).replace('.', ',');\n    const letters = w => (w.match(/[a-zàèéìòù]/gi) || []).length;\n    const navOf = k => (s.screen === k || (k === 'lib' && s.screen === 'book')) ? { bg: 'var(--color-bg)', fg: 'var(--color-accent-800)' } : { bg: 'transparent', fg: 'var(--color-text)' };\n    const go = k => () => this.setState({ screen: k, hover: -1 });\n    const titles = { dash: 'Panoramica del Project Work', read: 'Lettura CAA', mark: 'Marcatura docente', results: 'Risultati della sessione', settings: 'Impostazioni di accessibilità', lib: 'Archivio letture', classes: 'Classi e alunni', book: 'Storia in CAA' };\n    const modeNames = { touch: 'Touch', dwell: 'Puntamento oculare', switch: 'Scansione switch' };\n    const segOn = on => on ? { bg: 'var(--color-accent)', fg: 'var(--color-bg)' } : { bg: 'transparent', fg: 'var(--color-text)' };\n    const setMode = m => () => { this.lastScan = Date.now(); this.setState({ mode: m, hover: -1, dwellLock: -1, scanIdx: 0 }); };\n\n    const paths = [\n      { label: 'Proprietaria mitigata', vals: ['Cloud del fornitore', 'Necessario (artt. 8 e 9 GDPR)', 'Probabilistico, modello proprietario', 'DPIA ex art. 35 e nomina ex art. 28 GDPR', 'Non previsto: riconoscimento vocale'] },\n      { label: 'Locale deterministica', vals: ['Nel browser, in RAM, senza persistenza', 'Non serve per il cloud: nessun dato lascia il dispositivo', 'Formule deterministiche verificabili riga per riga', 'Valutazione del docente, griglia B.1 locale', 'Touch, puntamento oculare, scansione switch'] },\n      { label: 'Open-source locale', vals: [\"Server o dispositivo dell'istituto\", \"Da valutare: i dati restano nell'istituto\", 'Probabilistico, pesi aperti', 'DPIA e gestione tecnica interna', 'Da integrare'] },\n    ];\n    const cmpLabels = ['Elaborazione dei dati vocali', 'Consenso al trattamento biometrico', 'Tipo di calcolo', 'Adempimenti per la scuola', 'Input assistivo (CAA, dwell, switch)'];\n\n    const N = s.seq.length, done = N >= 6;\n    const dt = s.t0 ? ((s.t1 ?? now) - s.t0) / 1000 : 0;\n    const wpm = dt > 0 ? N / dt * 60 : 0;\n    const kindCol = { persona: ['var(--color-neutral-200)', 'var(--color-neutral-400)'], nome: ['var(--color-accent-2-100)', 'var(--color-accent-2-300)'], verbo: ['var(--color-accent-100)', 'var(--color-accent-300)'] };\n    const tiles = this.TILES.map((t, i) => {\n      const [bg, bd] = kindCol[t.kind];\n      const scanned = s.mode === 'switch' && s.scanIdx === i && !done;\n      const hov = s.mode === 'dwell' && s.hover === i && s.dwellLock !== i && !done;\n      const p = hov ? Math.min(1, (now - s.hoverT) / (s.tDwell * 1000)) : 0;\n      return {\n        label: t.label, img: \"'assets/caa/\" + t.label + \".jpg'\", bg, border: scanned ? 'var(--color-accent)' : hov ? 'var(--color-accent-400)' : bd,\n        shadow: scanned ? 'var(--shadow-lg)' : 'var(--shadow-sm)', scale: scanned ? 'scale(1.05)' : 'scale(1)',\n        showRing: hov, ringBg: 'conic-gradient(var(--color-accent) ' + Math.round(p * 360) + 'deg, var(--color-neutral-300) 0deg)',\n        used: s.seq.includes(i),\n        onClick: () => { if (s.mode === 'touch') this.activate(i); },\n        onEnter: () => this.setState({ hover: i, hoverT: Date.now(), now: Date.now() }),\n        onLeave: () => this.setState({ hover: -1, dwellLock: -1 }),\n      };\n    });\n    const readWords = this.WORDS.map(([w, tok]) => {\n      const isDone = tok != null && tok < N, isNext = tok === N && s.guide && !done;\n      return { w, bg: isNext ? 'var(--color-accent-200)' : 'transparent', fg: isDone ? 'var(--color-accent-2-800)' : 'var(--color-text)', deco: isDone ? 'underline' : 'none' };\n    });\n    const slots = [0, 1, 2, 3, 4, 5].map(k => k < N ? { label: this.TILES[s.seq[k]].label, img: \"'assets/caa/\" + this.TILES[s.seq[k]].label + \".jpg'\", hasImg: true, bg: kindCol[this.TILES[s.seq[k]].kind][0], bstyle: 'solid' } : { label: '', img: '', hasImg: false, bg: 'transparent', bstyle: 'dashed' });\n    const rf = {\n      family: s.font === 'alta' ? \"'Atkinson Hyperlegible', var(--font-body)\" : 'var(--font-body)',\n      size: { M: '28px', L: '36px', XL: '46px' }[s.size], tt: s.font === 'maiusc' ? 'uppercase' : 'none', ls: s.font === 'standard' ? '0' : '0.03em',\n    };\n    const instr = {\n      touch: 'Tocca le tessere nell\\'ordine della frase.',\n      dwell: 'Fissa una tessera per ' + fmt(s.tDwell) + ' s per attivarla.',\n      switch: 'Premi lo switch quando è evidenziata la tessera giusta · ' + fmt(s.scanInt) + ' s per tessera.',\n    }[s.mode];\n\n    const lTot = s.passage.reduce((a, w) => a + letters(w), 0);\n    const lCorr = s.passage.reduce((a, w, i) => a + (s.marks[i] ? 0 : letters(w)), 0);\n    const nMarked = Object.values(s.marks).filter(Boolean).length;\n    const mdt = s.m0 ? ((s.m1 ?? now) - s.m0) / 1000 : 0;\n    const lpm = mdt > 0 ? lCorr / mdt * 60 : 0, acc = lTot ? lCorr / lTot * 100 : 0;\n    const markWords = s.passage.map((w, i) => ({\n      w, bg: s.marks[i] ? 'var(--color-accent-200)' : 'transparent', fg: s.marks[i] ? 'var(--color-accent-800)' : 'var(--color-text)', deco: s.marks[i] ? 'line-through' : 'none',\n      onClick: () => this.setState(st => ({ marks: { ...st.marks, [i]: !st.marks[i] } })),\n    }));\n\n    const haveR = done, haveM = !!s.m1 && mdt > 0;\n    const rW = haveR ? wpm : 7.5, rL = haveM ? lpm : 62.3, rA = haveM ? acc : 94.2;\n    const trend = (v, p) => v > p + 0.05 ? '↑ in crescita' : v < p - 0.05 ? '↓ in calo' : '= stabile';\n    const kpis = [\n      { kicker: 'WPM · attivazione token CAA', val: fmt(rW), unit: 'token/min', trend: trend(rW, 6.1), prev: fmt(6.1), formula: 'WPM = (N_token / Δt) × 60', trace: haveR ? '= (' + N + ' / ' + fmt(dt) + ') × 60 = ' + fmt(wpm) : '= (6 / 48,0) × 60 = 7,5', bg: 'var(--color-accent-2-200)' },\n      { kicker: 'LPM · velocità di lettura', val: fmt(rL), unit: 'lettere/min', trend: trend(rL, 55.8), prev: fmt(55.8), formula: 'LPM = (N_lettere / Δt) × 60', trace: haveM ? '= (' + lCorr + ' / ' + fmt(mdt) + ') × 60 = ' + fmt(lpm) : '= (81 / 78,0) × 60 = 62,3', bg: 'var(--color-accent-200)' },\n      { kicker: 'Accuratezza di lettura', val: fmt(rA), unit: '%', trend: trend(rA, 91), prev: fmt(91) + ' %', formula: 'Acc = (corrette / totali) × 100', trace: haveM ? '= (' + lCorr + ' / ' + lTot + ') × 100 = ' + fmt(acc) : '= (81 / 86) × 100 = 94,2', bg: 'var(--color-surface)' },\n    ];\n    const att = haveR ? s.attempts : 7, errs = haveR ? s.errors : 1;\n    const actRows = [\n      { label: 'Modalità di input', val: modeNames[s.mode] + (s.mode === 'dwell' ? ' · ' + fmt(s.tDwell) + ' s' : s.mode === 'switch' ? ' · ' + fmt(s.scanInt) + ' s' : '') },\n      { label: 'Tessere attivate correttamente', val: String(haveR ? N : 6) },\n      { label: 'Tentativi / errori', val: att + ' / ' + errs },\n      { label: 'Accuratezza di attivazione', val: fmt(haveR ? N / s.attempts * 100 : 85.7) + ' %' },\n      { label: 'Tempo medio per tessera', val: fmt(haveR ? dt / s.attempts : 6.9) + ' s' },\n    ];\n    const dims = ['Comprensione delle tessere', 'Intenzionalità comunicativa', \"Autonomia nell'uso dell'input\", 'Tenuta attentiva', 'Interazione con docente e pari'];\n    const obsRows = dims.map((label, d) => ({\n      label, pills: [1, 2, 3, 4].map(n => {\n        const on = s.obs[d] === n;\n        return { n, bg: on ? 'var(--color-accent)' : 'transparent', fg: on ? 'var(--color-bg)' : 'var(--color-text)', border: on ? 'var(--color-accent)' : 'var(--color-neutral-400)', onClick: () => this.setState(st => ({ obs: { ...st.obs, [d]: n } })) };\n      }),\n    }));\n\n    const modeList = [\n      { k: 'touch', label: 'Touch', desc: 'Selezione diretta con dito, mouse o penna.' },\n      { k: 'dwell', label: 'Puntamento oculare', desc: 'Attivazione per fissazione (dwell selection).' },\n      { k: 'switch', label: 'Scansione switch', desc: 'Evidenziazione ciclica, un solo tasto fisico.' },\n    ];\n    const fonts = [\n      { k: 'standard', label: 'Figtree', note: 'Standard', family: 'var(--font-body)', tt: 'none' },\n      { k: 'alta', label: 'Atkinson Hyperlegible', note: 'Alta leggibilità', family: \"'Atkinson Hyperlegible', var(--font-body)\", tt: 'none' },\n      { k: 'maiusc', label: 'Stampato maiuscolo', note: 'Primi lettori', family: 'var(--font-body)', tt: 'uppercase' },\n    ];\n\n    const role = s.role;\n    const T = this.TOPICS, H = this.HERE;\n    const say = (q, a, act) => this.setState(st => ({ msgs: [...st.msgs, { from: 'user', text: q }, { from: 'bot', text: a, act }] }));\n    const pickRole = r => () => {\n      if (s.role === r) return;\n      this.setState(st => ({\n        role: r, msgs: [...st.msgs, { from: 'user', text: r === 'doc' ? \"Sono un'insegnante\" : \"Sono un alunno o un'alunna\" },\n          { from: 'bot', text: r === 'doc' ? 'Benvenuta! Posso spiegarti ogni schermata e come leggere i dati. Scegli una domanda qui sotto.' : 'Evviva, leggiamo insieme! Cosa vuoi sapere?' }],\n      }));\n    };\n    const botChips = !role\n      ? [{ label: \"Sono un'insegnante\", onClick: pickRole('doc') }, { label: \"Sono un alunno o un'alunna\", onClick: pickRole('stu') }]\n      : [{ label: 'Cosa posso fare qui?', onClick: () => say('Cosa posso fare qui?', H[role][s.screen], role === 'stu' && s.screen !== 'read' && s.screen !== 'settings' ? { label: 'Andiamo a leggere', to: 'read' } : null) }]\n        .concat(T[role].map(t => ({ label: t.q, onClick: () => say(t.q, t.a, t.act) })));\n    const big = role === 'stu';\n    const botMsgs = s.msgs.map(m => {\n      const bot = m.from === 'bot';\n      return {\n        text: m.text, align: bot ? 'flex-start' : 'flex-end', bg: bot ? 'var(--color-bg)' : 'var(--color-accent-2-700)', fg: bot ? 'var(--color-text)' : 'var(--color-bg)',\n        radius: bot ? '22px 22px 22px 6px' : '22px 22px 6px 22px', size: big ? '16.5px' : '14px',\n        hasAction: !!m.act, actionLabel: m.act ? m.act.label : '',\n        onAction: () => { if (!m.act) return; this.lastScan = Date.now(); this.setState(st => ({ screen: m.act.to, mode: m.act.mode ?? st.mode, hover: -1, dwellLock: -1 })); },\n      };\n    });\n\n    return {\n      nav: { dash: navOf('dash'), read: navOf('read'), mark: navOf('mark'), results: navOf('results'), settings: navOf('settings'), lib: navOf('lib'), classes: navOf('classes') },\n      goClasses: go('classes'), isClasses: s.screen === 'classes', isBook: s.screen === 'book', ...this.bookVals(s),\n      ...this.classVals(s),\n      goLib: go('lib'), isLib: s.screen === 'lib', passageTitle: s.passageTitle,\n      ...this.libVals(s),\n      goDash: go('dash'), goRead: go('read'), goMark: go('mark'), goResults: go('results'), goSettings: go('settings'),\n      screenTitle: titles[s.screen], modeLabel: modeNames[s.mode],\n      isDash: s.screen === 'dash', isRead: s.screen === 'read', isMark: s.screen === 'mark', isResults: s.screen === 'results', isSettings: s.screen === 'settings',\n      pathBtns: paths.map((p, i) => ({ label: p.label, ...segOn(s.path === i), onClick: () => this.setState({ path: i }) })),\n      cmpRows: cmpLabels.map((label, j) => ({ label, val: paths[s.path].vals[j] })),\n      modeBtns: modeList.map(m => ({ label: m.label, ...segOn(s.mode === m.k), onClick: setMode(m.k) })),\n      readTime: fmt(dt), nTok: N, nErr: s.errors,\n      resetRead: () => this.setState({ seq: [], attempts: 0, errors: 0, t0: null, t1: null, msg: '', dwellLock: -1 }),\n      rf, readWords, slots, notDone: !done, isDone: done, instruction: instr, msg: s.msg, isSwitch: s.mode === 'switch',\n      switchPress: () => this.activate(s.scanIdx),\n      attemptsTxt: s.attempts + ' tentativi, ' + s.errors + ' errori · WPM ' + fmt(wpm),\n      tiles,\n      markWords, lTot, lCorr, nMarked, markTime: fmt(mdt), lpmTxt: mdt > 0 ? fmt(lpm) : '—', accTxt: fmt(acc),\n      markBtn: s.mRun ? 'Ferma' : s.m1 ? 'Riparti' : 'Avvia',\n      toggleMark: () => this.setState(st => st.mRun ? { mRun: false, m1: Date.now(), now: Date.now() } : { mRun: true, m0: Date.now(), m1: null, now: Date.now() }),\n      resetMark: () => this.setState({ marks: {}, mRun: false, m0: null, m1: null }),\n      toggleRec: () => this.setState(st => ({ rec: !st.rec })),\n      recDot: s.rec ? 'var(--color-accent)' : 'var(--color-neutral-400)', recLabel: s.rec ? 'In registrazione · RAM' : 'Registra per il riascolto',\n      resSource: haveR && haveM ? 'Sessione attuale' : haveR || haveM ? 'Sessione attuale + dati di esempio' : 'Dati di esempio',\n      kpis, showTrace: this.props.showTrace ?? true, actRows, obsRows, ...this.chartVals(s, rW, rL, rA),\n      modeCards: modeList.map(m => ({ ...m, border: s.mode === m.k ? 'var(--color-accent)' : 'transparent', bg: s.mode === m.k ? 'var(--color-accent-100)' : 'var(--color-surface)', onClick: setMode(m.k) })),\n      tDwell: s.tDwell, tDwellTxt: fmt(s.tDwell), setDwell: e => this.setState({ tDwell: parseFloat(e.target.value) }),\n      scanInt: s.scanInt, scanTxt: fmt(s.scanInt), setScan: e => this.setState({ scanInt: parseFloat(e.target.value) }),\n      fontCards: fonts.map(f => ({ ...f, border: s.font === f.k ? 'var(--color-accent)' : 'transparent', bg: s.font === f.k ? 'var(--color-accent-100)' : 'var(--color-surface)', onClick: () => this.setState({ font: f.k }) })),\n      sizeBtns: ['M', 'L', 'XL'].map(z => ({ label: z, ...segOn(s.size === z), onClick: () => this.setState({ size: z }) })),\n      toggleGuide: () => this.setState(st => ({ guide: !st.guide })),\n      guideTrack: s.guide ? 'var(--color-accent)' : 'var(--color-neutral-400)', guideKnob: s.guide ? '19px' : '3px',\n      previewHl: s.guide ? 'var(--color-accent-200)' : 'transparent',\n      rootDir, asideStyle, contentOrder, showBrand: !isCompact, botBottom, botPanelStyle,\n      botOpen: s.bot, botClosed: !s.bot, toggleBot: () => this.setState(st => ({ bot: !st.bot })),\n      botSub: 'Guida all\\'interfaccia · ' + titles[s.screen],\n      roleBtns: [{ k: 'doc', label: 'Insegnante' }, { k: 'stu', label: 'Alunno/a' }].map(r => ({ label: r.label, ...segOn(role === r.k), onClick: pickRole(r.k) })),\n      botMsgs, botChips, msgRef: this.msgRef,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
